rules:
  - id: py-unsafe-html-echo
    languages: [python]
    message: "Потенциально небезопасный вывод пользовательских данных в HTMLResponse"
    severity: WARNING
    patterns:
      - pattern: |
          HTMLResponse(f"...{$X}...")
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"

  - id: custom-hardcoded-secret-simple
    patterns:
      - pattern-either:
        - pattern: 'SECRET_KEY = "..."'
        - pattern: 'password = "..."'
        - pattern: 'token = "..."'
        - pattern: 'api_key = "..."'
        - pattern: 'API_KEY = "..."'
      - pattern-not: 'os.getenv(...)'
    message: "Возможно захардкоженный секрет. Используйте переменные окружения."
    languages: [python]
    severity: WARNING

  - id: custom-sql-injection-simple
    patterns:
      - pattern-either:
        - pattern: 'f"SELECT ...'
        - pattern: '"SELECT" + ...'
      - pattern-not: 'session.execute(...)'
    message: "Потенциальный риск SQL-инъекции"
    languages: [python]
    severity: WARNING

  - id: custom-insecure-deserialization-simple
    patterns:
      - pattern-either:
        - pattern: 'pickle.loads(...)'
        - pattern: 'yaml.load(...)'
      - pattern-not: 'yaml.safe_load(...)'
    message: "Небезопасная десериализация"
    languages: [python]
    severity: WARNING
