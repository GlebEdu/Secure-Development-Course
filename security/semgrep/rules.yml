rules:
  - id: py-unsafe-html-echo
    languages: [python]
    message: "Потенциально небезопасный вывод пользовательских данных в HTMLResponse"
    severity: WARNING
    patterns:
      - pattern: |
          HTMLResponse(f"...{$X}...")
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"

  - id: simple-hardcoded-secret
    pattern: "SECRET_KEY = ..."
    message: "Проверьте, не захардкожен ли SECRET_KEY"
    languages: [python]
    severity: WARNING

  - id: simple-password-check
    pattern: "password = ..."
    message: "Проверьте, не захардкожен ли пароль"
    languages: [python]
    severity: WARNING

  - id: simple-sql-fstring
    pattern: 'f"SELECT ..."'
    message: "Проверьте SQL запрос на инъекции"
    languages: [python]
    severity: WARNING
